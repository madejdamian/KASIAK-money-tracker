services:
  db:
    image: postgres:16.6
    container_name: et_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=et_db
    ports:
      - "5433:5432"
    networks:
      - et_network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: et_app
    depends_on:
      - db
    env_file:
      - backend/.env-dev
    ports:
      - "8080:8080"
    networks:
      - et_network

volumes:
  postgres_data:

networks:
  et_network:
    driver: bridge