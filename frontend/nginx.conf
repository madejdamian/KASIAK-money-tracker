server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # the service worker and manifest must always be revalidated, otherwise updates get stuck
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # built files carry a hash in their name
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # single-page app: every other address is handled by the router
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
