# Production stack for the VPS. The app listens only on the server itself (127.0.0.1:8080); it is
# reached from your phone and computer through Tailscale, which adds HTTPS (`tailscale serve`,
# see the steps in PROJECT_NOTES.md). The database has no ports at all.
#
# On the server this folder is used as it is (copy compose.yml and backup.sh, and create .env
# from .env.example). The image comes from GitHub (workflow "Publish image").
services:
  db:
    image: postgres:16-alpine
    container_name: kasiak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - kasiak_pg:/var/lib/postgresql/data
    networks:
      - internal
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/madejdamian/kasiak:latest
    container_name: kasiak-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_DRIVER: org.postgresql.Driver
      DB_HOST: db
      DB_PORT: "5432"
      DDL_AUTO: none
      HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SHOW_SQL: "false"
      # the server is small and shared with another app: keep the heap modest
      JAVA_TOOL_OPTIONS: -Xmx320m -Xss512k
    ports:
      # only the server itself can reach it; Tailscale forwards to this port
      - "127.0.0.1:8080:8080"
    networks:
      - internal
    mem_limit: 640m

volumes:
  kasiak_pg:

networks:
  internal:
